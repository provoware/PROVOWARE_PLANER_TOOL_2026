name: I004 Kalender Domain SQLite Qualifikation

on:
  push:
    branches:
      - agent/i004-calendar-domain-sqlite
  workflow_dispatch:
    inputs:
      verify_only:
        description: Gespeicherten Evidence-Commit nur verifizieren
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  qualifikation:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.12 bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: I004-Metadaten und Dokumentation vorbereiten
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          version = json.loads(Path('VERSION.json').read_text(encoding='utf-8'))
          version['version'] = '0.4.0-dev.1'
          version['iteration'] = 'I004'
          version['checkpoint'] = 'C004-KALENDER-DOMAIN-SQLITE'
          version['build_revision'] = max(int(version.get('build_revision', 1)), 4)
          Path('VERSION.json').write_text(json.dumps(version, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          contract = json.loads(Path('PROJECT_CONTRACT.json').read_text(encoding='utf-8'))
          contract['foundation']['current_iteration'] = 'I004'
          contract['foundation']['current_checkpoint'] = 'C004-KALENDER-DOMAIN-SQLITE'
          contract['foundation']['version'] = '0.4.0-dev.1'
          development = contract['development']
          development['calendar_domain_contract_required'] = True
          development['sqlite_migration_history_required'] = True
          development['calendar_backup_restore_required'] = True
          development['gui_service_boundary_required'] = True
          development['historical_gate_chain_required'] = True
          Path('PROJECT_CONTRACT.json').write_text(json.dumps(contract, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          status = json.loads(Path('PROJEKTSTATUS.json').read_text(encoding='utf-8'))
          status['version'] = '0.4.0-dev.1'
          status['iteration'] = 'I004'
          status['checkpoint'] = 'C004-KALENDER-DOMAIN-SQLITE'
          status['status'] = 'QUALIFIZIERUNG_LAEUFT'
          status['ampel'] = 'GELB'
          status['implementation_percent'] = max(int(status.get('implementation_percent', 0)), 25)
          status['next_logical_step'] = 'I005 Kalender-GUI auf ausschließlich qualifizierter Service-API'
          status['improvement_recommendation'] = 'I005 mit Design-Tokens, vier Kalenderansichten und automatischer GUI-/Barrierefreiheitsmatrix aufbauen'
          Path('PROJEKTSTATUS.json').write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def append_once(path, marker, block):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if marker not in text:
                  p.write_text(text.rstrip() + '\n\n' + block.strip() + '\n', encoding='utf-8')

          append_once('README.md', '## I004 — Kalender-Domainkern + SQLite-Persistenz', '''
          ## I004 — Kalender-Domainkern + SQLite-Persistenz
          - Version: `0.4.0-dev.1`
          - GUI-unabhängiges Kalender-Domainmodell mit verbindlichen Invarianten
          - SQLite mit Foreign Keys, WAL, FULL-Synchronisierung und Transaktionen
          - Zeitpunkte kanonisch UTC, IANA-Zeitzone separat erhalten
          - fünf editierbare Markierungstypen als Stammdaten
          - hashgebundene unveränderliche Migrationen mit Vor-Migrations-Backup
          - Optimistic Locking und Soft Delete
          - atomisches Backup/Restore mit SHA-256, Kandidatenprüfung und WAL-Schutz
          - modulare, projektweit validierte Fehlerkataloge
          - GUI darf ausschließlich die qualifizierte `CalendarService`-API verwenden

          ### Nächster logischer Schritt
          I005: Kalender-GUI mit Tag-, Woche-, Monat- und Jahransicht auf dem qualifizierten I004-Service aufbauen.
          ''')
          append_once('TODO.md', '## I004 — Kalender-Domainkern + SQLite-Persistenz', '''
          ## I004 — Kalender-Domainkern + SQLite-Persistenz
          - [x] Domainmodell und Invarianten
          - [x] SQLite-Schema und fünf Markierungstypen
          - [x] UTC-Persistenz mit erhaltener IANA-Zeitzone
          - [x] hashgebundene Migrationen
          - [x] automatisches Vor-Migrations-Backup
          - [x] Repository und Service-API
          - [x] Optimistic Locking und Soft Delete
          - [x] atomisches Backup und Restore
          - [x] Crash-/Rollback- und Fault-Injection-Tests
          - [x] historische Gate-Kette I002 → I003 → I004

          ## I005 — Nächster logischer Schritt
          - [ ] Kalender-GUI ausschließlich über CalendarService
          - [ ] Tag-, Woche-, Monat- und Jahransicht
          - [ ] fünf Markierungen sichtbar und editierbar
          - [ ] Design-Tokens, flexible Schrift und Ampelstatus verwenden
          - [ ] automatisierte GUI- und Barrierefreiheitsmatrix
          ''')
          append_once('CHANGELOG.md', '## 0.4.0-dev.1 — I004', '''
          ## 0.4.0-dev.1 — I004
          - GUI-unabhängigen Kalender-Domainkern eingeführt
          - SQLite-Persistenz mit Constraints, Foreign Keys, WAL und Transaktionen ergänzt
          - UTC-Zeitpersistenz und IANA-Zeitzonenvertrag ergänzt
          - fünf editierbare Markierungstypen als Datenmodell eingeführt
          - hashgebundene Migrationen mit automatischem Vor-Migrations-Backup eingeführt
          - Optimistic Locking und Soft Delete ergänzt
          - atomisches, SHA-256-validierbares Backup/Restore mit WAL-Schutz ergänzt
          - modularen Kalender-Fehlerkatalog und globale Fehlercode-Eindeutigkeit ergänzt
          - Autopilot um historische Pflichtgates erweitert
          - zweistufige I004-Remotequalifikation ergänzt
          ''')
          PY

      - name: Gespeicherten Remote-Receipt unabhängig prüfen
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          receipt = json.loads(Path('REMOTE_TREE_RECEIPT.json').read_text(encoding='utf-8'))
          report = json.loads(Path('QUALIFICATION_REPORT.json').read_text(encoding='utf-8'))
          if receipt.get('state') != 'ATTESTED':
              print('GESPEICHERTER_RECEIPT=PENDING')
              raise SystemExit(0)
          subject = receipt['subject_commit']
          actual_tree = subprocess.check_output(['git','rev-parse',f'{subject}^{{tree}}'], text=True).strip()
          if actual_tree != receipt.get('subject_tree'):
              raise SystemExit('REMOTE-TREE-001: Subject-Tree stimmt nicht')
          output = subprocess.check_output(['git','ls-tree','-r','-l',subject], text=True)
          actual = {}
          for line in output.splitlines():
              meta, path = line.split('\t', 1)
              mode, _kind, blob_sha, size = meta.split()
              actual[path] = (mode, blob_sha, int(size))
          expected = {item['path']: (item['mode'], item['blob_sha'], item['size']) for item in receipt.get('subject_tree_entries', [])}
          if actual != expected or len(expected) != receipt.get('entry_count'):
              raise SystemExit('REMOTE-TREE-001: gespeicherter Receipt weicht vom Subject ab')
          if report.get('state') == 'QUALIFIED' and report.get('result') != 'PASS':
              raise SystemExit('QUALIFICATION-001: gespeicherter Bericht ist nicht PASS')
          print(f'GESPEICHERTER_RECEIPT=PASS files={len(actual)} subject={subject}')
          PY

      - name: Repository-Soll aus realem Arbeitsbaum ableiten
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(
              str(p) for p in Path('.').rglob('*')
              if p.is_file() and '.git' not in p.parts and '__pycache__' not in p.parts and '.pytest_cache' not in p.parts
          )
          version = json.loads(Path('VERSION.json').read_text(encoding='utf-8'))
          data = json.loads(Path('REPOSITORY_MANIFEST.json').read_text(encoding='utf-8'))
          data['project_id'] = 'PROVOWARE-PLANER-2026'
          data['version'] = version['version']
          data['iteration'] = version['iteration']
          data['ignored_path_parts'] = ['.git', '__pycache__', '.pytest_cache']
          data['expected_file_count'] = len(files)
          data['files'] = files
          data['expected_paths'] = files
          data['full_check_each_iteration'] = True
          Path('REPOSITORY_MANIFEST.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'REPOSITORY_SOLLPFADE={len(files)}')
          PY

      - name: Manifeste und SHA-256-Inventar erzeugen
        run: python tools/autopilot/manifest_builder.py --write

      - name: Manifest-Inventar prüfen
        run: python tools/autopilot/manifest_builder.py --check

      - name: I002-Evidence-Gate regressionsprüfen
        run: python tools/autopilot/i002_validator.py

      - name: I003-Start-Gate regressionsprüfen
        run: python tools/autopilot/i003_validator.py

      - name: I004-Kalender-Datenvertrag prüfen
        run: python tools/autopilot/i004_validator.py

      - name: Reale Kalender-Datenprobe
        shell: bash
        run: |
          python - <<'PY'
          import tempfile
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from services.factory import open_calendar_service

          with tempfile.TemporaryDirectory(prefix='provoware-i004-probe-') as tmp:
              root = Path(tmp)
              service = open_calendar_service(root / 'planner.sqlite3', backup_dir=root / 'backups')
              berlin = ZoneInfo('Europe/Berlin')
              base = datetime(2026, 8, 1, 8, 0, tzinfo=berlin)
              ids = []
              for index in range(250):
                  start = base + timedelta(hours=index * 3)
                  event = service.create_event(
                      title=f'Automatik {index:03d}',
                      start_at=start,
                      end_at=start + timedelta(minutes=45),
                      timezone_name='Europe/Berlin',
                      marker_id=(index % 5) + 1,
                  )
                  ids.append(event.event_id)
              found = service.list_events(base - timedelta(minutes=1), base + timedelta(hours=1000))
              if len(found) != 250 or len({item.event_id for item in found}) != 250:
                  raise SystemExit(f'CALENDAR_DATA_PROBE_FAIL count={len(found)}')
              print('CALENDAR_DATA_PROBE=PASS events=250 markers=5')
          PY

      - name: Kalender-Kern- und Fault-Tests
        run: python -m unittest discover -s tests -v

      - name: Foundation-Validator prüfen
        run: python tools/autopilot/standard_validator.py

      - name: Autopilot mit historischen Gates qualifizieren
        run: python tools/autopilot/autopilot.py qualifizieren

      - name: Remote-Tree-Pfade und Modi prüfen
        shell: bash
        run: git ls-tree -r -l HEAD | python tools/autopilot/remote_tree_validator.py

      - name: Qualifizierten Status setzen und Manifeste nachvalidieren
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('PROJEKTSTATUS.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['status'] = 'QUALIFIZIERT'
          data['ampel'] = 'GRUEN'
          data['qualification_percent'] = max(int(data.get('qualification_percent', 0)), 60)
          data['release_readiness_percent'] = max(int(data.get('release_readiness_percent', 0)), 8)
          completed = data.setdefault('last_completed', [])
          if 'I004-KALENDER-DOMAIN-SQLITE' not in completed:
              completed.append('I004-KALENDER-DOMAIN-SQLITE')
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python tools/autopilot/manifest_builder.py --write
          python tools/autopilot/manifest_builder.py --check
          python tools/autopilot/i002_validator.py
          python tools/autopilot/i003_validator.py
          python tools/autopilot/i004_validator.py
          python tools/autopilot/standard_validator.py
          python tools/autopilot/autopilot.py qualifizieren

      - name: Remote-Receipt und Qualifikationsbericht erzeugen
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          SUBJECT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          subject = os.environ['SUBJECT_SHA']
          run_id = int(os.environ['RUN_ID'])
          tree = subprocess.check_output(['git','rev-parse',f'{subject}^{{tree}}'], text=True).strip()
          output = subprocess.check_output(['git','ls-tree','-r','-l',subject], text=True)
          entries = []
          for line in output.splitlines():
              meta, path = line.split('\t', 1)
              mode, _kind, blob_sha, size = meta.split()
              entries.append({'path': path, 'blob_sha': blob_sha, 'mode': mode, 'size': int(size), 'status': 'PASS'})
          Path('REMOTE_TREE_RECEIPT.json').write_text(json.dumps({
              'schema_version': 1,
              'state': 'ATTESTED',
              'subject_commit': subject,
              'subject_tree': tree,
              'entry_count': len(entries),
              'subject_tree_entries': entries,
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          gates = [
              'stored_receipt_validation', 'repository_inventory', 'sha256_inventory',
              'manifest_chain', 'i002_historical_gate', 'i003_historical_gate',
              'i004_calendar_data_contract', 'calendar_data_probe', 'calendar_fault_tests',
              'unit_regression_tests', 'foundation_validator', 'autopilot_historical_chain',
              'remote_tree_paths_modes'
          ]
          Path('QUALIFICATION_REPORT.json').write_text(json.dumps({
              'schema_version': 1,
              'state': 'QUALIFIED',
              'result': 'PASS',
              'iteration': 'I004',
              'subject_commit': subject,
              'subject_tree': tree,
              'workflow_run_id': run_id,
              'gates': gates,
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'REMOTE_RECEIPT=PASS files={len(entries)} tree={tree}')
          PY

      - name: Qualifizierte Evidence einmalig persistieren
        if: ${{ !inputs.verify_only }}
        shell: bash
        run: |
          if git log -1 --pretty=%s | grep -q '^evidence: persist I004'; then
            echo 'EVIDENCE_PERSIST=SKIP_ALREADY_EVIDENCE_COMMIT'
            exit 0
          fi
          git config user.name 'PROVOWARE Evidence Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add PROJECT_CONTRACT.json VERSION.json PROJEKTSTATUS.json README.md TODO.md CHANGELOG.md REPOSITORY_MANIFEST.json SOURCE_MANIFEST.json BUILD_MANIFEST.json RELEASE_MANIFEST.json EVIDENCE_MANIFEST.json MANIFEST_INDEX.json SHA256_DATEI_INVENTAR.json REMOTE_TREE_RECEIPT.json QUALIFICATION_REPORT.json
          if git diff --cached --quiet; then
            echo 'EVIDENCE_PERSIST=NO_CHANGES'
            exit 0
          fi
          git commit -m "evidence: persist I004 run ${GITHUB_RUN_ID}"
          git push origin HEAD:agent/i004-calendar-domain-sqlite
          echo "EVIDENCE_COMMIT=$(git rev-parse HEAD)"

      - name: Evidence-Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: i004-evidence
          if-no-files-found: error
          path: |
            SOURCE_MANIFEST.json
            BUILD_MANIFEST.json
            RELEASE_MANIFEST.json
            EVIDENCE_MANIFEST.json
            MANIFEST_INDEX.json
            SHA256_DATEI_INVENTAR.json
            REMOTE_TREE_RECEIPT.json
            QUALIFICATION_REPORT.json
            REPOSITORY_MANIFEST.json

      - name: Gespeicherten Evidence-Commit automatisch erneut verifizieren
        if: ${{ !inputs.verify_only }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/i004-qualifikation.yml/dispatches \
            -d '{"ref":"agent/i004-calendar-domain-sqlite","inputs":{"verify_only":"true"}}'
          echo 'SECOND_STAGE_DISPATCH=PASS'
