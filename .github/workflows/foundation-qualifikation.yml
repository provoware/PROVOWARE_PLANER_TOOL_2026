name: Foundation-Qualifikation

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  foundation:
    name: Standards, Inventar und Autopilot
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Repository vollständig auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: P0 statische Vorprüfung ohne Runtime-Setup
        run: python3 tools/autopilot/preflight.py

      - name: Sollbestand aus Baseline und Iterationsplan materialisieren
        run: |
          python3 tools/autopilot/candidate_inventory.py --write-manifest
          python3 tools/autopilot/manifest_builder.py --write
          python3 tools/autopilot/manifest_builder.py --check
          python3 tools/autopilot/standard_validator.py

      - name: I016 Restore-Execution-Zieltests
        run: |
          python3 -m unittest discover -s tests -p 'test_i016_restore_execution.py' -v
          python3 -m unittest discover -s tests -p 'test_i016_restore_crash_recovery.py' -v
          python3 tools/i016_restore_crash_matrix.py --output "$RUNNER_TEMP/I016_RESTORE_CRASH_MATRIX.json"
          python3 tools/autopilot/i016_validator.py

      - name: Python 3.12 mit Lockdatei-Cache bereitstellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-gui.lock

      - name: Native GUI-Systembibliotheken bereitstellen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: GUI-Laufzeit exakt bereitstellen
        run: |
          python -m pip install --disable-pip-version-check -r requirements-gui.lock
          python -m pip check

      - name: I016 Transportgrenze und deterministischer Fresh-Unpack
        run: |
          rm -rf "$RUNNER_TEMP/i016-user-a" "$RUNNER_TEMP/i016-user-b" "$RUNNER_TEMP/i016-unpacked" "$RUNNER_TEMP/i016-workspace"
          python tools/package_transport.py --profile NUTZER --output-dir "$RUNNER_TEMP/i016-user-a"
          python tools/package_transport.py --profile NUTZER --output-dir "$RUNNER_TEMP/i016-user-b"
          A=$(find "$RUNNER_TEMP/i016-user-a" -maxdepth 1 -name 'PROVOWARE_PLANER_NUTZER_*.zip' -print -quit)
          B=$(find "$RUNNER_TEMP/i016-user-b" -maxdepth 1 -name 'PROVOWARE_PLANER_NUTZER_*.zip' -print -quit)
          test -n "$A" -a -n "$B"
          test "$(sha256sum "$A" | awk '{print $1}')" = "$(sha256sum "$B" | awk '{print $1}')"
          mkdir -p "$RUNNER_TEMP/i016-unpacked"
          unzip -q "$A" -d "$RUNNER_TEMP/i016-unpacked"
          test -f "$RUNNER_TEMP/i016-unpacked/backup_core/execution.py"
          test -f "$RUNNER_TEMP/i016-unpacked/services/restore_execution_service.py"
          test -f "$RUNNER_TEMP/i016-unpacked/storage/restore_guard.py"
          test -f "$RUNNER_TEMP/i016-unpacked/runtime/restore_recovery.py"
          test ! -d "$RUNNER_TEMP/i016-unpacked/tests"
          test ! -d "$RUNNER_TEMP/i016-unpacked/standards"
          if find "$RUNNER_TEMP/i016-unpacked" -type d -name '.provoware_restore' | grep -q .; then exit 1; fi
          if find "$RUNNER_TEMP/i016-unpacked" -type f \( -name 'RESTORE_INTENT.json' -o -name 'RESTORE_LEASE.json' -o -name 'PRE_RESTORE_SNAPSHOT.sqlite3' -o -name '*.pre-restore' \) | grep -q .; then exit 1; fi
          (cd "$RUNNER_TEMP/i016-unpacked" && python tools/start_gui.py --workspace "$RUNNER_TEMP/i016-workspace" --offscreen-smoke)
          cp "$A" "$RUNNER_TEMP/PROVOWARE_PLANER_NUTZER_I016_FINAL.zip"

      - name: Vollständige Unit- und Regressionstests genau einmal
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Risikorelevante GUI-Matrizen
        run: |
          python tools/i012_diagnostics_gui_matrix.py --output "$RUNNER_TEMP/i016-i012-diagnostics"
          python tools/i010_sync_gui_matrix.py --output "$RUNNER_TEMP/i016-i010-sync"
          python tools/todo_gui_matrix.py --output "$RUNNER_TEMP/i016-i007-todo"
          python tools/gui_matrix.py --output "$RUNNER_TEMP/i016-i005-calendar"

      - name: Bestehende Fault- und Crash-Matrizen
        run: |
          python tools/i015_restore_fault_matrix.py --output "$RUNNER_TEMP/I016_I015_RESTORE_FAULT_MATRIX.json"
          python tools/i011_history_fault_matrix.py --output "$RUNNER_TEMP/I016_I011_HISTORY_FAULT_MATRIX.json"
          python tools/i010_resolution_fault_matrix.py --output "$RUNNER_TEMP/I016_I010_RESOLUTION_FAULT_MATRIX.json"
          python tools/i009_fault_matrix.py --output "$RUNNER_TEMP/I016_I009_FAULT_MATRIX.json"
          python tools/i006_fault_matrix.py --output "$RUNNER_TEMP/I016_I006_FAULT_MATRIX.json"

      - name: Standards und historische Gate-Kette genau einmal qualifizieren
        run: python tools/autopilot/autopilot.py qualifizieren --timing-output "$RUNNER_TEMP/FOUNDATION_GATE_TIMINGS.json"

      - name: Remote-Tree-Pfade und Modi prüfen
        run: git ls-tree -r -l HEAD | python tools/autopilot/remote_tree_validator.py

      - name: Qualifizierten Evidence-Kandidaten erzeugen
        env:
          QUALIFICATION_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          subject = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          tree = subprocess.check_output(['git','rev-parse',f'{subject}^{{tree}}'], text=True).strip()
          run_id = int(os.environ['QUALIFICATION_RUN_ID'])
          status_path = Path('PROJEKTSTATUS.json')
          status = json.loads(status_path.read_text(encoding='utf-8'))
          status.update(status='QUALIFIZIERT', ampel='GRUEN', implementation_percent=99, qualification_percent=99, release_readiness_percent=max(70, int(status.get('release_readiness_percent', 0))))
          completed = status.setdefault('last_completed', [])
          if 'I016-RESTORE-EXECUTION-SAFETY' not in completed:
              completed.append('I016-RESTORE-EXECUTION-SAFETY')
          status['next_logical_step'] = 'I017 Restore-Control-GUI ausschließlich über RestoreExecutionService'
          status['improvement_recommendation'] = 'Restore-GUI mit read-only Kandidatenvorschau, klarer Risikoanzeige und expliziter Bestätigung auf den qualifizierten I016-Pfad setzen'
          status_path.write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          todo = Path('TODO.md')
          todo_text = todo.read_text(encoding='utf-8')
          if 'I016 Restore Execution Safety qualifiziert' not in todo_text:
              todo_text += '\n- [x] I016 Restore Execution Safety qualifiziert\n- [ ] I017 Restore-Control-GUI ausschließlich über RestoreExecutionService\n'
          todo.write_text(todo_text, encoding='utf-8')
          changelog = Path('CHANGELOG.md')
          change_text = changelog.read_text(encoding='utf-8')
          if '## 0.16.0-dev.1 — I016' not in change_text:
              change_text += '\n## 0.16.0-dev.1 — I016\n- Persistenter Restore-Intent und exklusive Restore-Lease.\n- Harter Prozessabbruch nach atomarem Datenbanktausch wird beim nächsten Start deterministisch recovered.\n- Vorzustands-Snapshot und Planner-Schreibguard ergänzen den unveränderten I015-Restorekern.\n'
          changelog.write_text(change_text, encoding='utf-8')
          entries = []
          raw = subprocess.check_output(['git','ls-tree','-r','-l',subject], text=True)
          for line in raw.splitlines():
              meta, path = line.split('\t', 1)
              mode, kind, blob, size = meta.split()
              entries.append({'path': path, 'blob_sha': blob, 'mode': mode, 'size': int(size), 'status': 'PASS'})
          Path('REMOTE_TREE_RECEIPT.json').write_text(json.dumps({'schema_version':1,'state':'ATTESTED','attestation_role':'QUALIFICATION_SUBJECT_TREE','subject_commit':subject,'subject_tree':tree,'entry_count':len(entries),'subject_tree_entries':entries}, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('QUALIFICATION_REPORT.json').write_text(json.dumps({'schema_version':1,'state':'QUALIFIED','result':'PASS','iteration':'I016','evidence_model':'qualification_subject_plus_evidence_overlay','qualification_subject_commit':subject,'qualification_subject_tree':tree,'workflow_run_id':run_id,'verify_only':False,'gates':['p0_static_preflight','baseline_plus_declared_delta_inventory','i016_execution_safety_tests','i016_hard_process_exit_recovery','i016_transport_fresh_unpack','unit_regression_suite_once','risk_gui_matrices_322','historical_fault_matrices','autopilot_historical_chain_once','remote_tree_paths_modes','exact_evidence_sha_second_pass']}, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python tools/autopilot/manifest_builder.py --write
          python tools/autopilot/manifest_builder.py --check

      - name: Evidence-Kandidat hochladen
        uses: actions/upload-artifact@v4
        with:
          name: i016-evidence-candidate
          path: |
            VERSION.json
            PROJEKTSTATUS.json
            ITERATION_PLAN.json
            QUALIFICATION_REPORT.json
            REMOTE_TREE_RECEIPT.json
            REPOSITORY_MANIFEST.json
            SHA256_DATEI_INVENTAR.json
            SOURCE_MANIFEST.json
            BUILD_MANIFEST.json
            RELEASE_MANIFEST.json
            EVIDENCE_MANIFEST.json
            MANIFEST_INDEX.json
            README.md
            TODO.md
            CHANGELOG.md
            ${{ runner.temp }}/FOUNDATION_GATE_TIMINGS.json
            ${{ runner.temp }}/I016_RESTORE_CRASH_MATRIX.json
          retention-days: 90

      - name: Nutzerpaket-Kandidat hochladen
        uses: actions/upload-artifact@v4
        with:
          name: i016-nutzerpaket-candidate
          path: ${{ runner.temp }}/PROVOWARE_PLANER_NUTZER_I016_FINAL.zip
          retention-days: 90

      - name: Qualifizierte Evidence einmalig persistieren
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$(git log -1 --pretty=%s)" == evidence:\ persist\ I016* ]]; then
            echo "EVIDENCE_PERSIST=SKIP_EXACT_SHA_VERIFY"
            exit 0
          fi
          git config user.name "PROVOWARE Evidence Bot"
          git config user.email "actions@users.noreply.github.com"
          git add VERSION.json PROJEKTSTATUS.json ITERATION_PLAN.json QUALIFICATION_REPORT.json REMOTE_TREE_RECEIPT.json REPOSITORY_MANIFEST.json SHA256_DATEI_INVENTAR.json SOURCE_MANIFEST.json BUILD_MANIFEST.json RELEASE_MANIFEST.json EVIDENCE_MANIFEST.json MANIFEST_INDEX.json README.md TODO.md CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "evidence: persist I016 run $GITHUB_RUN_ID"
            git push origin HEAD:"$BRANCH_NAME"
          fi
