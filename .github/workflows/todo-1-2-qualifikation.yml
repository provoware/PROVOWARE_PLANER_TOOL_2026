name: TODO 1.2 Qualifikation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  walking-skeleton:
    name: Tauri Walking Skeleton / Ubuntu 22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Quellstand abrufen
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euxo pipefail
          git init .
          git remote add origin https://github.com/${GITHUB_REPOSITORY}.git
          git fetch --depth=1 origin "$HEAD_SHA"
          git checkout --detach FETCH_HEAD

      - name: Linux-Abhängigkeiten installieren
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev xvfb xdotool dbus-x11 iproute2

      - name: Toolchain erfassen
        run: |
          set -euxo pipefail
          rustc --version
          cargo --version
          pkg-config --modversion webkit2gtk-4.1

      - name: Statische TODO-1.2-Vorprüfung
        run: python3 tests/smoke/todo_1_2_static.py

      - name: Rust formatieren und prüfen
        run: |
          set -euxo pipefail
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo check --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Debug-Binary bauen
        run: cargo build --manifest-path src-tauri/Cargo.toml

      - name: Offline-Fensterstart und Restart prüfen
        run: |
          set -euxo pipefail
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 -ac >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          sleep 2

          run_offline_once() {
            sudo unshare --net -- bash -lc '
              set -e
              ip link set lo up
              export DISPLAY=:99
              exec dbus-run-session -- ./src-tauri/target/debug/provoware-planer-2026
            ' >/tmp/provoware-app.log 2>&1 &
            APP_PID=$!

            FOUND=0
            for _ in $(seq 1 30); do
              if xdotool search --name "PROVOWARE Planer 2026" >/tmp/window-ids.txt 2>/dev/null; then
                FOUND=1
                break
              fi
              sleep 0.5
            done

            if [ "$FOUND" -ne 1 ]; then
              cat /tmp/provoware-app.log || true
              sudo pkill -f provoware-planer-2026 || true
              kill "$APP_PID" || true
              return 1
            fi

            sudo pkill -f provoware-planer-2026 || true
            wait "$APP_PID" || true
          }

          run_offline_once
          run_offline_once
          kill "$XVFB_PID" || true

      - name: Keine Remote-Runtime-Assets
        run: python3 tests/smoke/todo_1_2_static.py
